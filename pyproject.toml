[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "placar"
version = "0.1.0"
description = "Palpite pra copa 2026"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Yuri Pontes", email = "yurilbrok23@gmail.com" }]
keywords = ["futebol", "previsao", "placar", "monte-carlo", "backtest", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = []

[project.scripts]
placar = "cli:main"

[tool.setuptools]
py-modules = ["cli", "formula"]
